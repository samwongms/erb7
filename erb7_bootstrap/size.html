<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <!-- width sizes-->
        <div class="w-25 bg-success">Width 25%</div>
        <div class="w-50 bg-success">Width 50%</div>
        <div class="w-75 bg-success">Width 75%</div>
        <div class="w-100 bg-success">Width 100%</div>
        <div class="w-auto bg-success">Width Auto</div>
        <!-- height -->
        <div style="height: 300px; border: 10px solid #c43d14">
            <div class="h-25 bg-success d-inline-block">Height 25%</div>
            <div class="h-50 bg-success d-inline-block">Height 50%</div>
            <div class="h-75 bg-success d-inline-block">Height 75%</div>
            <div class="h-100 bg-success d-inline-block">Height 100%</div>
            <div class="h-auto bg-success d-inline-block">Height Auto</div>
        </div>
        <!-- border -->
        <div class="border bg-light mb-2">regular</div>
        <div class="border-top bg-light">top</div>
        <div class="border-right bg-light">right</div>
        <div class="border-bottom bg-light">bottom</div>
        <div class="border-left bg-light">left</div>

        <!-- border color -->
        <div class="p-3 mb-2 bg-light border border-primary">Primary</div>
        <div class="p-3 mb-2 bg-light border border-danger">danger</div>
        <div class="p-3 mb-2 bg-light border border-info">info</div>
        <div class="p-3 mb-2 bg-light border roundeded-left border-success">round-left</div>
        <div class="p-3 mb-2 bg-light border rounded-bottom border-success">rounded bottom</div>
        <div class="p-3 mb-2 bg-light border rounded-right border-success">roundedvright</div>
        <div class="p-3 mb-2 w-25 bg-light border rounded-circle border-success">circle</div>
        




    </div>
        
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
</body>
</html>
